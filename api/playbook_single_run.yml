---
# This file is included by playbook_main.yml for each script execution
- name: "Processing script: {{ script_item.filename }} in {{ script_item.module_dir }} on host {{ script_item.target_host }}"
  block:
    # Construct the full path relative to the playbook execution directory (private_data_dir)
    - name: Set script path variable
      set_fact:
        full_script_path: "{{ script_base_dir }}/{{ script_item.module_dir }}/{{ script_item.filename }}"

    - name: "Debug script path"
      ansible.builtin.debug:
        var: full_script_path

    - name: "Check if {{ full_script_path }} exists locally"
      ansible.builtin.stat:
        path: "{{ full_script_path }}"
      register: r_script_test
      delegate_to: localhost # Check path on the control node (where ansible-runner runs)

    - name: "Execute {{ script_item.filename }} on {{ script_item.target_host }} if it exists"
      when: r_script_test.stat.exists
      ansible.builtin.script: "{{ full_script_path }}" # Pass the full path to the script module
      register: r_result
      delegate_to: "{{ script_item.target_host }}" # Delegate script execution to the target host

  # Always output the script results to a file
  always:
    - name: "Output script result for {{ script_item.filename }}"
      ansible.builtin.debug:
        var: r_result.stdout
      when: r_result is defined and r_result.stdout is defined and r_result.stdout != ""

    - name: "Write script result for {{ script_item.filename }} to file"
      ansible.builtin.copy:
        content: "{{ r_result.stdout | default('') }}" # Add default for safety
        # Ensure unique filenames or structure if multiple scripts write output
        dest: "{{ job_info_dir }}/{{ script_item.target_host }}_{{ script_item.filename }}.out"
      delegate_to: localhost
      when: r_result is defined and job_info_dir is defined